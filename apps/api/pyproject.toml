[project]
name = "delay_tracker"
version = "0.1.0"
description = "Tracks delays and cancellations on Deutsche Bahn routes and serves punctuality statistics by time of day and weekday. Built with FastAPI, PostgreSQL and SQLAlchemy."
authors = [
    { name = "Philipp Hertweck" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[tool.fastapi]
entrypoint = "delay_tracker.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
